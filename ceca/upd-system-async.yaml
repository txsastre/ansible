---
- name: Actualización completa del sistema
  hosts: all
  become: true
  gather_facts: no

  vars:
    max_retries: 3
    retry_delay: 10

  tasks:

    - name: Mostrar versión actual del kernel y fecha
      ansible.builtin.shell: |
        echo "Kernel: $(uname -r)"
        echo "Fecha: $(date)"
      register: sys_info
      changed_when: false
      tags: update

    - name: Mostrar info del sistema antes de actualizar
      debug:
        msg: "{{ sys_info.stdout_lines }}"
      tags: update

    - name: Actualizar paquetes (modo async)
      ansible.builtin.dnf:
        name: '*'
        state: latest
      async: 600
      poll: 0
      register: dnf_job

    - name: Esperar a que termine la actualización
      ansible.builtin.async_status:
        jid: "{{ dnf_job.ansible_job_id }}"
      register: dnf_job_result
      until: dnf_job_result.finished
      retries: "{{ max_retries }}"
      delay: "{{ retry_delay }}"

    - name: Mostrar resumen actualización
      debug:
        msg: >
          Paquetes actualizados: {{ update_result.changed | default(false) }}
          {{ update_result.msg if update_result.msg is defined else '' }}
      tags: update

    - name: Mostrar mensaje final bonito (una sola vez)
      ansible.builtin.debug:
        msg: |
          * Actualización completada.
          - Revisa posibles mensajes de error.
          - Si todo ok - ejecutar tareas post.
      run_once: true
      tags: update
