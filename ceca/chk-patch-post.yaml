---
- name: Comprobacion despues parcheo
  hosts: all
  become: true
  gather_facts: true
  gather_subset:
    - min
  vars:
    ruta_evidencias_local: "{{ lookup('env', 'HOME') }}/evidencias"
    evidencias_dir: "/home/{{ lookup('env', 'HOME').split('/')[-1] }}/{{ ansible_hostname }}"

  tasks:

    #====================  POST-Patch =============================
    - name: Obtener el nombre de usuario del HOME local (controlador)
      set_fact:
        local_user: "{{ lookup('env', 'HOME').split('/')[-1] }}"
      tags: evidencias

    - name: Obtener hostname real del sistema remoto
      ansible.builtin.command: hostname
      register: remote_hostname
      tags: evidencias

    - name: Crear directorio en /home/$LOCALUSER/$HOSTNAME en el host remoto (post-patch)
      ansible.builtin.file:
        path: "/home/{{ local_user }}/{{ remote_hostname.stdout }}"
        state: directory
        mode: '0755'
      tags: evidencias

    - name: Ejecutar comandos y guardar salidas post-patch en el host remoto
      ansible.builtin.shell: |
        mkdir -p "/home/{{ local_user }}/{{ remote_hostname.stdout }}"
        uname -r > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/kernel_after"
        ip a > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/ip_a_after"
        ip route > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/ip_route_after"
        modinfo zfs > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/modinfo_zfs_after"
        cat /proc/mounts > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/proc_mount_after"
        df -h --output=source,fstype,size,target | egrep -v 'tmpfs|Filesystem' | sort > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/df_h_after"
        systemctl --type=service --state=active | grep running | sort > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/systemctl_after"
        alternatives --display java > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/java_after"
      args:
        executable: /bin/bash
      tags: evidencias

    - name: Mostrar debug con la ruta remota post-patch
      debug:
        msg: "Post-patch archivos guardados en /home/{{ local_user }}/{{ remote_hostname.stdout }}"
      tags: evidencias


    - name: Analizar presencia y estado de falcon, qualys y audit en systemctl_before.txt
      ansible.builtin.shell: |
        echo "Estado en systemctl_before.txt:" > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/check_services_before.txt"
        grep -iE 'falcon|qualys|audit' "/home/{{ local_user }}/{{ remote_hostname.stdout }}/systemctl_before.txt" >> "/home/{{ local_user }}/{{ remote_hostname.stdout }}/check_services_before.txt" || echo "No encontrados" >> "/home/{{ local_user }}/{{ remote_hostname.stdout }}/check_services_before.txt"
      tags: evidencias

    - name: Analizar presencia y estado de falcon, qualys y audit en systemctl_after
      ansible.builtin.shell: |
        echo "Estado en systemctl_after:" > "/home/{{ local_user }}/{{ remote_hostname.stdout }}/check_services_after.txt"
        grep -iE 'falcon|qualys|audit' "/home/{{ local_user }}/{{ remote_hostname.stdout }}/systemctl_after" >> "/home/{{ local_user }}/{{ remote_hostname.stdout }}/check_services_after.txt" || echo "No encontrados" >> "/home/{{ local_user }}/{{ remote_hostname.stdout }}/check_services_after.txt"
      tags: evidencias

    - name: Comparar archivos df_h_*
      shell: diff df_h_before.txt df_h_after
      args:
        chdir: "{{ evidencias_dir }}"
      register: diff_df_h_result
      ignore_errors: yes
      tags: evidencias

    - name: Mostrar resultado diff df_h_* línea por línea
      debug:
        var: item
      loop: "{{ diff_df_h_result.stdout_lines | default(['No hay diferencias']) }}"
      tags: evidencias

    - name: Comparar archivos systemctl_*
      shell: diff systemctl_before.txt systemctl_after
      args:
        chdir: "{{ evidencias_dir }}"
      register: diff_systemctl_result
      ignore_errors: yes
      tags: evidencias

    - name: Mostrar resultado diff systemctl_* línea por línea
      debug:
        var: item
      loop: "{{ diff_systemctl_result.stdout_lines | default(['No hay diferencias']) }}"
      tags: evidencias

#====================  KERNELS =============================
    - name: Obtener versión mayor de RHEL
      ansible.builtin.shell: "rpm -E %{rhel}"
      register: rhel_version
      changed_when: false
      tags: kernel

    - name: Backup de /etc/yum.conf
      ansible.builtin.copy:
        src: /etc/yum.conf
        dest: /etc/yum.conf.bak
        remote_src: yes
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['distribution'] == "RedHat" or ansible_facts['distribution'] == "CentOS"
      tags: kernel

    - name: Modificar installonly_limit en /etc/yum.conf a 2
      ansible.builtin.lineinfile:
        path: /etc/yum.conf
        regexp: '^installonly_limit='
        line: 'installonly_limit=2'
        backup: yes
      when: ansible_facts['distribution'] == "RedHat" or ansible_facts['distribution'] == "CentOS"
      tags: kernel

    - name: Limpiar kernels antiguos en RHEL7 con package-cleanup
      ansible.builtin.shell: |
        echo "y" | package-cleanup --oldkernels --count=2
      when: rhel_version.stdout == "7"
      tags: kernel

    - name: Limpiar kernels antiguos en RHEL8 y superiores con dnf remove
      ansible.builtin.shell: |
        echo "y" | dnf remove --oldinstallonly --setopt installonly_limit=2 -y
      when: rhel_version.stdout|int > 7
      tags: kernel

    - name: Mostrar kernels instalados tras limpieza
      ansible.builtin.shell: rpm -q kernel
      register: kernel_list_post
      changed_when: false
      tags: kernel

    - name: Mostrar kernels instalados
      debug:
        msg: "Kernels instalados tras limpieza: {{ kernel_list_post.stdout_lines }}"
      tags: kernel


#==================== VERSION-KERNELS ACTUAL - crear en role o include-task  =============================

    - name: Ejecutar tareas de get_sysinfo - Kernel y SO version.
      include_tasks: get_sysinfo.yaml

